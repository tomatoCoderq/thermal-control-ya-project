# Fourier phase classification. Data and masks are the same as in
# polynom-classification; only the feature extraction changes.

paths:
  data_dir: ../data
  labels_dir: ../labels
  mask_type: automated_mask          # automated_mask | manual_mask
  feature_dir: fourier_features
  log_dir: fourier_runs

classes:
  gray2cls: {0: 0, 51: 1, 102: 2, 153: 3, 204: 4, 255: 5}
  cls_depth: {1: 0.5, 2: 1.0, 3: 1.5, 4: 2.0, 5: 2.5}
  class_names: ["фон", "0.5", "1.0", "1.5", "2.0", "2.5"]

fourier:
  first_bin: 1                       # 0 is the DC component; do not use it
  n_frequencies: 8                  # first eight non-zero low frequencies
  phase_encoding: raw               # raw = paper-like phasegrams; sin_cos is wrap-safe
  window: none                       # none = closest to the paper; hann is optional
  detrend: none                      # none | constant | linear
  start_at_peak: false              # false = FFT of the full temperature history
  row_chunk: 32                     # bounds memory use for 256x320x1810 files

crop:
  crop: 48
  n_bg_per_video: 8

model:
  name: convnext_nano                # same model as polynom-classification
  dropout: 0.3
  pretrained: false

train:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  n_test_videos: 10
  max_videos: null
  loss_name: label_smooth            # ce | weighted_ce | label_smooth
  seed: 67




