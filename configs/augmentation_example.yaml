mode: temporal
train: true
seed: 0
samples_per_video: 1
cache_dir: artifacts/cache
sources:
- root: archive/data
  masks: archive/labels/manual_mask
  pattern: '*.mat'
temporal:
  sampler: keypoints
  num_frames: 8
  jitter: 0
  frame_drop_p: 0.0
  time_pad: repeat_last
  add_dt_channel: false
  frame_range:
  - 0
  - 200
crop:
  size:
  - 192
  - 192
  strategy: roi_random
  pad_mode: reflect
  roi_padding: 16
mask:
  kind: multiclass
  num_classes: 6
  missing: zeros
norm:
  mode: per_sample
augs:
  spatial:
  - name: HorizontalFlip
    params:
      p: 0.5
  - name: VerticalFlip
    params:
      p: 0.5
  - name: RandomRotate90
    params:
      p: 0.5
  - name: Affine
    params:
      scale:
      - 0.85
      - 1.15
      translate_percent:
      - -0.08
      - 0.08
      rotate:
      - -25
      - 25
      border_mode: 0
      p: 0.8
  - name: ElasticTransform
    params:
      alpha: 40
      sigma: 6
      p: 0.3
