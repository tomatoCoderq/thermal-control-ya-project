# Сырые кадры из середины ролика (irt_data temporal). Пути — от корня репо.

mode: temporal
train: true
seed: 0
samples_per_video: 4

sources:
  - root: data
    masks: labels/kaggle_binary_masks
    pattern: "*.mat"

cache_dir: artifacts/cache

temporal:
  sampler: uniform
  num_frames: 1
  # берём окно примерно [T/3, 2T/3) через frame_range — задаётся долей через files_meta
  # или оставляем full + sampler; для середины используем frame_range на весь датасет:
  frame_range: null

object_crop:
  enabled: true
  roi: {x: 80, y: 25, w: 178, h: 190}
  square_pad: true
  pad_mode: reflect
  output_size: [256, 256]

crop:
  size: [256, 256]
  strategy: random
  pad_mode: resize

files_meta: {}

augs:
  apply: one_of
  spatial:
    - name: HorizontalFlip
      params: {p: 0.5}
    - name: VerticalFlip
      params: {p: 0.5}
    - name: RandomRotate90
      params: {p: 0.5}
  use_replay_fallback: true

norm:
  mode: per_sample

mask:
  kind: binary
  missing: zeros

loader:
  batch_size: 8
  num_workers: 0
  shuffle: true
  collate: stack
